name: trading-agent

# ---------------------------------------------------------------------------
# Lance l'agent automatiquement, même quand ton ordinateur est éteint :
# l'exécution se fait sur les serveurs de GitHub.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Chaque lundi à 15h30 UTC -> milieu de matinée à New York (marché US ouvert),
    # que ce soit en heure d'été ou d'hiver. Format cron : "min heure * * jour".
    # Ex. tous les jours ouvrés : "30 15 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer à la main (test)

permissions:
  contents: write   # nécessaire pour sauvegarder le journal dans le dépôt

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # --- Clés : elles viennent des SECRETS chiffrés du dépôt (jamais en clair) ---
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # --- Config (modifiable ici, ce ne sont pas des secrets) ---
      # PAPER = simulation. Pour le RÉEL : mettre "false" ICI **et** "yes" à la ligne suivante,
      # et remplacer les secrets Alpaca par tes clés LIVE (différentes des clés paper).
      ALPACA_PAPER: "false"
      I_UNDERSTAND_LIVE_RISK: "yes"

      WATCHLIST: "AAPL,MSFT,GOOGL,AMZN,NVDA"
      MAX_NOTIONAL_PER_ORDER: "10"
      MAX_ORDERS_PER_DAY: "3"
      MAX_DRAWDOWN_PCT: "20"
      LLM_MODEL: "claude-sonnet-5"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_MAX_USES: "5"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'agent
        run: python agent.py

      - name: Sauvegarder le journal dans le dépôt (persistance)
        if: always()   # on sauvegarde même si l'étape précédente a un souci
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trades_log.jsonl start_equity.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau à sauvegarder."
          else
            git commit -m "Journal du $(date -u +%F) [skip ci]"
            git push
          fi
